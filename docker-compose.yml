services:
  backend:
    build:
      context: ./backend
    container_name: audio-backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?required}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?required}
      S3_BUCKET: audio-processing
      KAFKA_BROKER: kafka:29092
      KAFKA_JOB_CREATED_TOPIC: audio.jobs.created
      SESSION_SECRET: ${SESSION_SECRET:?required}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
      MAX_UPLOAD_BYTES: 262144000
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_JOB_CREATED_TOPIC: audio.jobs.created
      KAFKA_CONSUMER_GROUP: audio-worker
      KAFKA_DEAD_LETTER_TOPIC: audio.jobs.dead-letter
      MAX_PROCESSING_ATTEMPTS: 3
      RETRY_BACKOFF_SECONDS: 5
      DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?required}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?required}
      S3_BUCKET: audio-processing
      PROCESSING_MODE: demucs
      DEMUCS_MODEL: htdemucs_6s
    volumes:
      - demucs_model_cache:/root/.cache/torch
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 1h

  postgres:
    image: postgres:16
    container_name: audio-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: audio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      until mc alias set local http://minio:9000
      \"$${MINIO_ROOT_USER}\"
      \"$${MINIO_ROOT_PASSWORD}\";
        do echo 'Waiting for MinIO to be ready...';
        sleep 2;
      done;

      mc mb --ignore-existing local/audio-processing;
      echo 'MinIO is ready and bucket audio-processing exists.';
      "

  kafka:
    image: apache/kafka:4.3.1
    container_name: audio-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: audio-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list;
        do echo 'Waiting for Kafka to be ready...';
        sleep 2;
      done;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic audio.jobs.created
      --partitions 3
      --replication-factor 1;

      echo 'Kafka topic audio.jobs.created is ready.';

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic audio.jobs.dead-letter
      --partitions 1
      --replication-factor 1;

      echo 'Kafka topic audio.jobs.dead-letter is ready.';
      "

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  demucs_model_cache:
