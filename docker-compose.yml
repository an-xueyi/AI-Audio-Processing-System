services:
  backend:
    build:
      context: ./backend
    container_name: audio-backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://audio_user:audio_password@postgres:5432/audio_processing
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin123
      S3_BUCKET: audio-processing
      KAFKA_BROKER: kafka:29092
      KAFKA_JOB_CREATED_TOPIC: audio.jobs.created
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - minio
      - kafka-init
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    container_name: audio-worker
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_JOB_CREATED_TOPIC: audio.jobs.created
      DATABASE_URL: postgresql://audio_user:audio_password@postgres:5432/audio_processing
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin123
      S3_BUCKET: audio-processing
      PROCESSING_MODE: demucs
      DEMUCS_MODEL: htdemucs
    volumes:
      - demucs_model_cache:/root/.cache/torch
    depends_on:
      - postgres
      - minio
      - kafka-init
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: audio-postgres
    environment:
      POSTGRES_USER: audio_user
      POSTGRES_PASSWORD: audio_password
      POSTGRES_DB: audio_processing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: audio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  kafka:
    image: apache/kafka:4.3.1
    container_name: audio-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: audio-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list;
        do echo 'Waiting for Kafka to be ready...';
        sleep 2;
      done;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic audio.jobs.created
      --partitions 1
      --replication-factor 1;

      echo 'Kafka topic audio.jobs.created is ready.';
      "

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  demucs_model_cache:
