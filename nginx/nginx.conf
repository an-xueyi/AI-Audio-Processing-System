# Nginx is the single public entry point for the backend API. The browser sends
# requests to localhost:4000, but Nginx chooses which backend container handles
# each request. This means the browser does not need to know how many backend
# replicas are running or what their private Docker addresses are.

events {
  # Nginx requires an events block even when no custom event settings are
  # needed. Connection handling is implemented by Nginx inside this block.
}

http {
  # Containers created by Docker Compose discover one another through Docker's
  # internal DNS server at 127.0.0.11. The short lifetime makes Nginx refresh
  # the list of backend container addresses after replicas are added or removed.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;

  # A WebSocket begins as a normal HTTP request containing an Upgrade header.
  # Nginx must forward the special "upgrade" connection value when that header
  # exists. Ordinary HTTP requests receive the normal "close" value instead.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream backend_pool {
    # The shared-memory zone stores the discovered backend addresses and their
    # health information where all Nginx worker processes can access it.
    zone backend_pool 64k;

    # least_conn sends a new request to the replica currently serving the fewest
    # active connections. This is useful here because WebSocket connections can
    # remain open much longer than ordinary API requests.
    least_conn;

    # "backend" is the Docker Compose service name, not a fixed container name.
    # Docker DNS can return every running backend replica. The resolve option
    # tells Nginx to update that list without requiring an Nginx restart.
    server backend:4000 resolve max_fails=2 fail_timeout=5s;
  }

  server {
    # Only Nginx publishes port 4000 to the Mac. Backend containers listen on
    # port 4000 inside Docker but are not directly reachable from the host.
    listen 4000;
    server_name _;

    # This endpoint checks Nginx itself. It does not travel to a backend replica,
    # so Docker can distinguish a healthy proxy from a healthy application.
    location = /nginx-health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok","service":"nginx"}';
    }

    location / {
      proxy_pass http://backend_pool;

      # WebSocket proxying requires HTTP/1.1 and explicit forwarding of the two
      # upgrade headers. These settings are harmless for ordinary HTTP routes.
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Preserve information about the original browser request. The backend can
      # use these headers later for logging, HTTPS detection, or rate limiting.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;

      # The backend sends a WebSocket heartbeat every 30 seconds. A 75-second
      # read timeout leaves room for a delayed heartbeat without keeping a truly
      # abandoned connection forever.
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
    }
  }
}
